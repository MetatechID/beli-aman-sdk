name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write   # for npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install
      - id: changesets
        uses: changesets/action@v1
        with:
          # Only run `publish:` after the Version Packages PR has been
          # merged (i.e. there are NO pending changesets to consume but
          # there ARE packages with versions higher than what's on npm).
          # The action's hasChangesets output is true while a Version PR
          # is open / pending merge — gate publish to the opposite case.
          # On every push to main: if changesets/*.md exist, open Version PR.
          # When that PR merges (changesets/*.md gone), publish.
          publish: pnpm run release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Skip until at least one changeset exists. Bootstrap has no
        # changesets yet, so don't trigger publish on the empty state.
        if: hashFiles('.changeset/*.md') != '' || hashFiles('.changeset/**/*.md') != ''
