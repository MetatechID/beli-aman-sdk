name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write   # for npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install
      - id: changesets
        uses: changesets/action@v1
        with:
          # changesets/action is internally idempotent: when `.changeset/*.md`
          # files exist, it opens/updates a "Version Packages" PR; when those
          # files have been consumed (PR merged) AND the package.json version
          # is ahead of what's on npm, it runs `publish:` to push to npm.
          # No outer `if:` gate — gating here breaks the post-merge publish
          # path (the .md is gone after merge, so the gate evaluates false
          # and the publish step never runs).
          publish: pnpm run release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
