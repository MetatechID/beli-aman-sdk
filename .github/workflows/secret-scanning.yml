name: Secret scanning

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scanning:
    name: Current tree and reachable history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch pinned scanner
        run: docker pull zricethezav/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
      - name: Test scanner and index hook with synthetic fixtures
        run: bash scripts/test-secret-scanning.sh
      - name: Scan current tree
        if: ${{ !cancelled() }}
        run: bash scripts/scan-secrets.sh tree
      - name: Scan all fetched reachable history
        if: ${{ !cancelled() }}
        run: bash scripts/scan-secrets.sh history
